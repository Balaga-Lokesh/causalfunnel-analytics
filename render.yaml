# Render Blueprint: the API (also serves tracker.js and the demo store).
# Render → New → Blueprint → pick this repo. You'll be asked for the secret values.
services:
  - type: web
    name: causalfunnel-analytics-api
    runtime: node
    plan: free
    region: singapore # closest Render region to the Atlas cluster (AWS Mumbai)
    buildCommand: npm ci && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # secret: paste the Atlas connection string in the Render dashboard
      - key: DASHBOARD_ORIGINS
        sync: false # the dashboard URL, e.g. https://causalfunnel-analytics.vercel.app
